groups:
  - name: rag-embedding.quota
    rules:
      - alert: RAGEmbeddingQuotaExceeded
        expr: increase(rag_embedding_quota_exceeded_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Embedding quota exceeded"
          description: "Tenant {{ $labels.tenant_id }} namespace {{ $labels.namespace }} exceeded embedding quota ({{ $labels.kind }})."
