apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools-gateway
  namespace: serphona
  labels:
    app: tools-gateway
    version: v1
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tools-gateway
  template:
    metadata:
      labels:
        app: tools-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tools-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;']
      
      - name: run-migrations
        image: migrate/migrate:v4.17.0
        command:
        - migrate
        - -path=/migrations
        - -database
        - $(DATABASE_URL)
        - up
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tools-gateway-secrets
              key: database-url
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
      
      containers:
      - name: tools-gateway
        image: serphona/tools-gateway:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 9090
          protocol: TCP
        
        env:
        - name: PORT
          value: "8080"
        - name: GRPC_PORT
          value: "9090"
        - name: ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        
        # Database
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: tools-gateway-config
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: tools-gateway-config
              key: db-port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: tools-gateway-config
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: tools-gateway-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tools-gateway-secrets
              key: db-password
        
        # Redis (for caching OAuth tokens)
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: tools-gateway-secrets
              key: redis-url
        
        # JWT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: tools-gateway-secrets
              key: jwt-secret
        
        # Observability
        - name: JAEGER_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: tools-gateway-config
              key: jaeger-endpoint
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      
      volumes:
      - name: migrations
        configMap:
          name: tools-gateway-migrations
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - tools-gateway
              topologyKey: kubernetes.io/hostname
