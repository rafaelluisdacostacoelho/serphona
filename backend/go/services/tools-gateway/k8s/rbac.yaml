apiVersion: v1
kind: ServiceAccount
metadata:
  name: tools-gateway
  namespace: serphona
  labels:
    app: tools-gateway

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tools-gateway
  namespace: serphona
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tools-gateway
  namespace: serphona
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tools-gateway
subjects:
- kind: ServiceAccount
  name: tools-gateway
  namespace: serphona
