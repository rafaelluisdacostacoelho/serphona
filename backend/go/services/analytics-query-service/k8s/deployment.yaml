apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-query-service
  namespace: serphona
  labels:
    app: analytics-query-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: analytics-query-service
  template:
    metadata:
      labels:
        app: analytics-query-service
        version: v1
    spec:
      containers:
      - name: analytics-query-service
        image: serphona/analytics-query-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8084
          protocol: TCP
        env:
        - name: HTTP_ADDR
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: HTTP_ADDR
        - name: GIN_MODE
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: GIN_MODE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: LOG_LEVEL
        - name: CLICKHOUSE_HOST
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: CLICKHOUSE_HOST
        - name: CLICKHOUSE_PORT
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: CLICKHOUSE_PORT
        - name: CLICKHOUSE_DATABASE
          valueFrom:
            configMapKeyRef:
              name: analytics-query-service
              key: CLICKHOUSE_DATABASE
        - name: CLICKHOUSE_USER
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: analytics-query-secret
              key: CLICKHOUSE_PASSWORD
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: REDIS_ADDR
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: REDIS_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: analytics-query-secret
              key: REDIS_PASSWORD
        - name: CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: CACHE_TTL
        - name: RATE_LIMIT
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: RATE_LIMIT
        - name: RATE_BURST
          valueFrom:
            configMapKeyRef:
              name: analytics-query-config
              key: RATE_BURST
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8084
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-query-service
  namespace: serphona
  labels:
    app: analytics-query-service
spec:
  type: ClusterIP
  ports:
  - port: 8084
    targetPort: 8084
    protocol: TCP
    name: http
  selector:
    app: analytics-query-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-query-service-hpa
  namespace: serphona
  labels:
    app: analytics-query-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-query-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
