apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-query-config
  namespace: serphona
  labels:
    app: analytics-query-service
    component: config
data:
  HTTP_ADDR: ":8084"
  GIN_MODE: "release"
  LOG_LEVEL: "info"
  
  # ClickHouse
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_DATABASE: "serphona_analytics"
  CLICKHOUSE_USER: "default"
  
  # Redis
  REDIS_ADDR: "redis:6379"
  REDIS_DB: "3"
  CACHE_TTL: "5m"
  
  # Rate Limiting
  RATE_LIMIT: "60"
  RATE_BURST: "10"
