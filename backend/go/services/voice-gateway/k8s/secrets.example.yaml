apiVersion: v1
kind: Secret
metadata:
  name: voice-gateway-secrets
  namespace: serphona
  labels:
    app: voice-gateway
    component: telephony
type: Opaque
stringData:
  # Asterisk ARI Credentials
  asterisk.ari.username: "serphona"
  asterisk.ari.password: "change-me-in-production"
  
  # Redis Password (if required)
  redis.password: ""
  
  # ElevenLabs API Key (optional)
  elevenlabs.api.key: ""

  # Service-to-service tokens
  tenant.manager.token: ""
  agent.orchestrator.token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: google-cloud-credentials
  namespace: serphona
  labels:
    app: voice-gateway
    component: telephony
type: Opaque
data:
  # Base64 encoded Google Cloud service account JSON
  # credentials.json: <base64-encoded-json>
  credentials.json: ""
