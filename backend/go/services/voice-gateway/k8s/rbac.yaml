apiVersion: v1
kind: ServiceAccount
metadata:
  name: voice-gateway
  namespace: serphona
  labels:
    app: voice-gateway
    component: telephony
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voice-gateway
  namespace: serphona
  labels:
    app: voice-gateway
    component: telephony
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voice-gateway
  namespace: serphona
  labels:
    app: voice-gateway
    component: telephony
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voice-gateway
subjects:
- kind: ServiceAccount
  name: voice-gateway
  namespace: serphona
