apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-gateway
  namespace: serphona
  labels:
    app: voice-gateway
    component: telephony
spec:
  podSelector:
    matchLabels:
      app: voice-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from other serphona services
  - from:
    - namespaceSelector:
        matchLabels:
          name: serphona
    ports:
    - protocol: TCP
      port: 8080
  # Allow from monitoring (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9091
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow Kafka
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Allow Asterisk
  - to:
    - podSelector:
        matchLabels:
          app: asterisk
    ports:
    - protocol: TCP
      port: 8088
  # Allow internal services
  - to:
    - namespaceSelector:
        matchLabels:
          name: serphona
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080
  # Allow external APIs (Google Cloud, ElevenLabs)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
