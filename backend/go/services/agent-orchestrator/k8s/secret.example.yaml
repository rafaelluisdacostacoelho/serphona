apiVersion: v1
kind: Secret
metadata:
  name: agent-orchestrator-secret
  namespace: serphona
type: Opaque
stringData:
  redis_password: "your-redis-password"
  openai_api_key: "sk-your-openai-api-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: agent-orchestrator-db
  namespace: serphona
type: Opaque
stringData:
  # DATABASE_URL is the only DB input required
  url: "postgresql://user:pass@postgres:5432/agent_orchestrator?sslmode=require"
