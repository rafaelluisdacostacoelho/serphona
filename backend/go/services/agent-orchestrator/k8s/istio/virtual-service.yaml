apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: agent-orchestrator
  namespace: serphona
spec:
  hosts:
  - agent-orchestrator
  http:
  - match:
    - uri:
        prefix: /api/v1/sessions
    route:
    - destination:
        host: agent-orchestrator
        port:
          number: 8080
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure,refused-stream
  - match:
    - uri:
        prefix: /api/v1/agents
    route:
    - destination:
        host: agent-orchestrator
        port:
          number: 8080
    timeout: 30s
  - match:
    - uri:
        prefix: /health
    - uri:
        prefix: /ready
    route:
    - destination:
        host: agent-orchestrator
        port:
          number: 8080
    timeout: 5s
