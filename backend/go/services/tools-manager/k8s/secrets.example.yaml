# Example only — do not commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: tools-manager-secrets
  namespace: serphona
  labels:
    app: tools-manager
    component: backend
    version: v1
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_MIN_32_CHARS"

---
apiVersion: v1
kind: Secret
metadata:
  name: tools-manager-db
  namespace: serphona
  labels:
    app: tools-manager
    component: backend
    version: v1
type: Opaque
stringData:
  url: "postgresql://tools_manager:CHANGE_ME@postgres.serphona.svc.cluster.local:5432/tools_manager?sslmode=require"
