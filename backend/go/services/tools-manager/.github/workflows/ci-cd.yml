name: Tools Manager CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/go/services/tools-manager/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/go/services/tools-manager/**'

env:
  SERVICE_NAME: tools-manager
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/tools-manager

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TOOLS_MANAGER_TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    defaults:
      run:
        working-directory: backend/go/services/tools-manager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go/services/tools-manager/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U test && break
            sleep 2
          done

      - name: Run migrations
        run: |
          psql "$TOOLS_MANAGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000001_create_catalog.up.sql
          psql "$TOOLS_MANAGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000002_policy_rules.up.sql
          psql "$TOOLS_MANAGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000003_quota_rules.up.sql

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/go/services/tools-manager/coverage.out
          flags: tools-manager

      - name: Run linter
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: backend/go/services/tools-manager

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: backend/go/services/tools-manager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/go/services/tools-manager
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: ${{ github.ref == 'refs/heads/develop' && 'development' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/tools-manager \
            tools-manager=${{ env.DOCKER_IMAGE }}:develop-${{ github.sha }} \
            -n serphona-dev
          kubectl rollout status deployment/tools-manager -n serphona-dev --timeout=5m

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/tools-manager \
            tools-manager=${{ env.DOCKER_IMAGE }}:main-${{ github.sha }} \
            -n serphona-prod
          kubectl rollout status deployment/tools-manager -n serphona-prod --timeout=5m
