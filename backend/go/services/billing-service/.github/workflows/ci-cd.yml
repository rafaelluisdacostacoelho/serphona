name: Billing Service CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/go/services/billing-service/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/go/services/billing-service/**'

env:
  SERVICE_NAME: billing-service
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/billing-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go/services/billing-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go/services/billing-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/go/services/billing-service/coverage.out
          flags: billing-service

      - name: Run linter
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: backend/go/services/billing-service

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: backend/go/services/billing-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/go/services/billing-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://billing-dev.serphona.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/billing-service \
            billing-service=${{ env.DOCKER_IMAGE }}:develop-${{ github.sha }} \
            -n serphona-dev
          kubectl rollout status deployment/billing-service -n serphona-dev --timeout=5m

      - name: Run database migrations
        run: |
          kubectl exec -n serphona-dev deployment/billing-service -- \
            /bin/sh -c "cd /app/migrations && for f in *up.sql; do psql \$DATABASE_URL -f \$f; done"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://billing.serphona.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/billing-service \
            billing-service=${{ env.DOCKER_IMAGE }}:main-${{ github.sha }} \
            -n serphona-prod
          kubectl rollout status deployment/billing-service -n serphona-prod --timeout=5m

      - name: Run database migrations
        run: |
          kubectl exec -n serphona-prod deployment/billing-service -- \
            /bin/sh -c "cd /app/migrations && for f in *up.sql; do psql \$DATABASE_URL -f \$f; done"

      - name: Verify deployment
        run: |
          kubectl get pods -n serphona-prod -l app=billing-service
          kubectl logs -n serphona-prod -l app=billing-service --tail=50
