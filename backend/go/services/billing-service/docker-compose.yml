version: '3.8'

services:
  billing-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing-service
    ports:
      - "8081:8081"
      - "9091:9091"  # Metrics
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8081
      - ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/serphona_billing?sslmode=disable
      - REDIS_URL=redis://redis:6379/1
      - KAFKA_BROKERS=kafka:9092
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      - JWT_SECRET=dev-jwt-secret-change-in-production-min-32-chars
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - serphona
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: billing-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=serphona_billing
    ports:
      - "5433:5432"  # Mapped to 5433 to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serphona

  redis:
    image: redis:7-alpine
    container_name: billing-redis
    ports:
      - "6380:6379"  # Mapped to 6380 to avoid conflicts
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serphona

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: billing-kafka
    ports:
      - "9093:9092"  # Mapped to 9093 to avoid conflicts
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - serphona

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: billing-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - serphona

  # Optional: Adminer for database management
  adminer:
    image: adminer:latest
    container_name: billing-adminer
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - serphona

networks:
  serphona:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
