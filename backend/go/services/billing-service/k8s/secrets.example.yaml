# This is an EXAMPLE file. Do NOT commit actual secrets to version control.
# Create the actual secrets using kubectl or your CI/CD pipeline:
# kubectl create secret generic billing-service-secrets \
#   --from-literal=STRIPE_SECRET_KEY=sk_live_... \
#   --from-literal=STRIPE_PUBLISHABLE_KEY=pk_live_... \
#   --from-literal=STRIPE_WEBHOOK_SECRET=whsec_... \
#   --from-literal=JWT_SECRET=your-jwt-secret \
#   --from-literal=REDIS_PASSWORD=your-redis-password \
#   --from-literal=REDIS_URL=redis://:<REPLACE_WITH_REDIS_PASSWORD>@redis.serphona.svc.cluster.local:6379/1 \
#   -n serphona
# kubectl create secret generic billing-service-db \
#   --from-literal=url=postgresql://postgres:<REPLACE_WITH_DB_PASSWORD>@postgres.serphona.svc.cluster.local:5432/serphona_billing?sslmode=require \
#   -n serphona

apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
  namespace: serphona
  labels:
    app: billing-service
type: Opaque
stringData:
  # Stripe API Keys (NEVER commit real keys!)
  STRIPE_SECRET_KEY: "sk_test_<REPLACE_WITH_ACTUAL_KEY>"
  STRIPE_PUBLISHABLE_KEY: "pk_test_<REPLACE_WITH_ACTUAL_KEY>"
  STRIPE_WEBHOOK_SECRET: "whsec_<REPLACE_WITH_ACTUAL_SECRET>"
  
  # JWT Secret
  JWT_SECRET: "<REPLACE_WITH_ACTUAL_JWT_SECRET_MIN_32_CHARS>"
  
  # Redis Password
  REDIS_PASSWORD: "<REPLACE_WITH_ACTUAL_REDIS_PASSWORD>"
  REDIS_URL: "redis://:<REPLACE_WITH_ACTUAL_REDIS_PASSWORD>@redis.serphona.svc.cluster.local:6379/1"

---
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-db
  namespace: serphona
  labels:
    app: billing-service
type: Opaque
stringData:
  # DATABASE_URL is the only required DB setting
  url: "postgresql://postgres:<REPLACE_WITH_ACTUAL_PASSWORD>@postgres.serphona.svc.cluster.local:5432/serphona_billing?sslmode=require"
