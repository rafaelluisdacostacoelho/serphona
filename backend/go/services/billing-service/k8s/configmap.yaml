apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: serphona
  labels:
    app: billing-service
data:
  # Server Configuration
  ENV: "production"
  
  # Database Configuration
  DB_HOST: "postgres.serphona.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "serphona_billing"
  DB_SSLMODE: "require"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: "5m"
  
  # Redis Configuration
  REDIS_HOST: "redis.serphona.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "1"
  
  # Kafka Configuration
  KAFKA_BROKERS: "kafka-0.kafka-headless.serphona.svc.cluster.local:9092,kafka-1.kafka-headless.serphona.svc.cluster.local:9092,kafka-2.kafka-headless.serphona.svc.cluster.local:9092"
  KAFKA_GROUP_ID: "billing-service"
  KAFKA_TOPICS: "billing.events,payments.webhooks,subscriptions.events"
  
  # Tenant Manager Integration
  TENANT_MANAGER_URL: "http://tenant-manager.serphona.svc.cluster.local"
  
  # JWT Configuration
  JWT_ISSUER: "serphona-auth"
  JWT_AUDIENCE: "serphona-api"
  
  # Wallet Configuration
  WALLET_DEFAULT_CURRENCY: "BRL"
  WALLET_INITIAL_CREDITS: "100"
  WALLET_MIN_TOPUP_AMOUNT: "1000"
  WALLET_MAX_TOPUP_AMOUNT: "1000000"
  
  # Subscription Plans
  PLAN_FREE_CREDITS_PER_MONTH: "100"
  PLAN_STARTER_CREDITS_PER_MONTH: "1000"
  PLAN_PROFESSIONAL_CREDITS_PER_MONTH: "10000"
  PLAN_ENTERPRISE_CREDITS_PER_MONTH: "100000"
  
  # Feature Flags
  ENABLE_CREDIT_WALLET: "true"
  ENABLE_SUBSCRIPTIONS: "true"
  ENABLE_INVOICING: "false"
  ENABLE_PAYMENT_METHODS: "true"
  
  # Observability
  ENABLE_METRICS: "true"
  METRICS_PORT: "9091"
  ENABLE_TRACING: "true"
  JAEGER_ENDPOINT: "http://jaeger-collector.observability.svc.cluster.local:14268/api/traces"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # CORS Configuration
  CORS_ALLOWED_ORIGINS: "https://console.serphona.com,https://app.serphona.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
  CORS_ALLOWED_HEADERS: "Content-Type,Authorization"
  
  # Stripe Configuration (non-sensitive)
  STRIPE_API_VERSION: "2023-10-16"
