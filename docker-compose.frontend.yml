version: '3.8'

services:
  # Auth Microfrontend
  auth-mfe:
    build:
      context: ./frontend/auth-mfe
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_AUTH_SERVICE_URL=http://localhost:8080/auth
    networks:
      - serphona-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Billing Microfrontend
  billing-mfe:
    build:
      context: ./frontend/billing-mfe
      dockerfile: Dockerfile
    ports:
      - "3003:80"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_BILLING_SERVICE_URL=http://localhost:8080/billing
    networks:
      - serphona-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Console Application
  console:
    build:
      context: ./frontend/console
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_AUTH_MFE_URL=http://localhost:3002
      - VITE_BILLING_MFE_URL=http://localhost:3003
    networks:
      - serphona-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Website
  website:
    build:
      context: ./frontend/website
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - serphona-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  serphona-network:
    driver: bridge
