name: CI Backend

on:
  push:
    branches:
      - main
      - develop
      - release/**
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

env:
  GO_VERSION: '1.24'
  PYTHON_VERSION: '3.11'

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend/go

  go-platform-core:
    name: Go - platform-core (lib)
    needs: go-lint
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/libs/platform-core
      build-binary: false

  go-platform-auth:
    name: Go - platform-auth (lib)
    needs: go-lint
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/libs/platform-auth
      build-binary: false

  go-platform-observability:
    name: Go - platform-observability (lib)
    needs: go-lint
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/libs/platform-observability
      build-binary: false

  go-platform-events:
    name: Go - platform-events (lib)
    needs: go-lint
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/libs/platform-events
      build-binary: false
      cache-dependency-path: backend/go/libs/platform-events/go.sum

  go-platform-mcp:
    name: Go - platform-mcp (lib)
    needs: go-lint
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/libs/platform-mcp
      build-binary: false
      cache-dependency-path: backend/go/libs/platform-mcp/go.sum

  go-platform-rag:
    name: Go - platform-rag (lib)
    needs: go-lint
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/libs/platform-rag
      build-binary: false
      cache-dependency-path: backend/go/libs/platform-rag/go.sum
      run-integration: true
      integration-dsn: postgres://test:test@localhost:55432/test?sslmode=disable

  go-test-dir:
    name: Go - test utilities
    needs: go-lint
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/libs/test
      build-binary: false
      cache-dependency-path: backend/go/libs/test/go.sum

  go-tenant-manager:
    name: Go - tenant-manager
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/services/tenant-manager
      need-postgres: true

  go-auth-gateway:
    name: Go - auth-gateway
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/services/auth-gateway
      need-postgres: true

  go-billing-service:
    name: Go - billing-service
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/services/billing-service
      need-postgres: true

  go-analytics-query-service:
    name: Go - analytics-query-service
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/services/analytics-query-service

  go-agent-orchestrator:
    name: Go - agent-orchestrator
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/services/agent-orchestrator

  go-tools-gateway:
    name: Go - tools-gateway
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/services/tools-gateway

  go-voice-gateway:
    name: Go - voice-gateway
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service-path: backend/go/services/voice-gateway

  python-analytics-processor:
    name: Python - analytics-processor-service
    uses: ./.github/workflows/reusable-python-service.yml
    with:
      service-path: backend/python/services/analytics-processor-service
      python-version: '3.11'
      need-clickhouse: true
      need-kafka: true
      docker-image: ghcr.io/${{ github.repository }}/analytics-processor-service
      push-image: false

  python-reporting-export:
    name: Python - reporting-export-service
    uses: ./.github/workflows/reusable-python-service.yml
    with:
      service-path: backend/python/services/reporting-export-service
      python-version: '3.11'
      need-clickhouse: false
      need-kafka: false
      push-image: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-tenant-manager, go-auth-gateway, go-billing-service, go-analytics-query-service, go-agent-orchestrator, go-tools-gateway, go-voice-gateway, python-analytics-processor, python-reporting-export]
    
    strategy:
      matrix:
        include:
          - service: tenant-manager
            context: backend/go/services/tenant-manager
          - service: auth-gateway
            context: backend/go/services/auth-gateway
          - service: billing-service
            context: backend/go/services/billing-service
          - service: analytics-processor
            context: backend/python/services/analytics-processor-service
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
