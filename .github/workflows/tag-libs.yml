name: Tag Go libs versions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-libs:
    name: Tag changed Go libs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed libs
        id: changed
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${AFTER}^"
          fi

          files=$(git diff --name-only "$BEFORE" "$AFTER" | grep '^backend/go/libs/[^/]\+/' || true)
          if [ -z "$files" ]; then
            echo "libs=" >> "$GITHUB_OUTPUT"
            echo "No backend/go/libs changes detected"
            exit 0
          fi

          libs=$(echo "$files" | cut -d/ -f1-4 | sort -u)
          printf 'libs<<EOF\n%s\nEOF\n' "$libs" >> "$GITHUB_OUTPUT"
          echo "Detected libs:" && echo "$libs"

      - name: Create tags for changed libs
        if: steps.changed.outputs.libs != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          new_tags=()
          while IFS= read -r lib; do
            [ -z "$lib" ] && continue
            version_file="$lib/VERSION"
            if [ ! -f "$version_file" ]; then
              echo "::error file=$version_file::VERSION file missing for $lib"
              exit 1
            fi
            version=$(tr -d ' \t\r\n' < "$version_file")
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error file=$version_file::VERSION is not semver (X.Y.Z): $version"
              exit 1
            fi

            tag="$lib/v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag already exists, skipping: $tag"
              continue
            fi

            git tag -a "$tag" -m "Release $tag from main"
            new_tags+=("$tag")
            echo "Prepared tag $tag"
          done <<< "${{ steps.changed.outputs.libs }}"

          if [ ${#new_tags[@]} -eq 0 ]; then
            echo "No new tags to push"
            exit 0
          fi

          echo "Pushing tags: ${new_tags[*]}"
          git push origin "${new_tags[@]}"
