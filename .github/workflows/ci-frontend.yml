name: CI Frontend

on:
  push:
    branches:
      - main
      - develop
      - release/**
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

env:
  NODE_VERSION: '18'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/console/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend/console
        run: npm ci
      
      - name: Run ESLint
        working-directory: frontend/console
        run: npm run lint
      
      - name: Type check
        working-directory: frontend/console
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/console/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend/console
        run: npm ci
      
      - name: Run tests
        working-directory: frontend/console
        run: npm run test -- --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: frontend/console/coverage/lcov.info
          flags: frontend

  mfe-test:
    name: Frontend (${{ matrix.app.name }}) Lint/Test/Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: auth-mfe
            path: frontend/auth-mfe
          - name: billing-mfe
            path: frontend/billing-mfe
          - name: website
            path: frontend/website
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.app.path }}
        run: npm run lint

      - name: Type check
        working-directory: ${{ matrix.app.path }}
        run: npx tsc --noEmit

      - name: Run tests (coverage when available)
        working-directory: ${{ matrix.app.path }}
        run: |
          if npm run | grep -q "test:coverage"; then
            npm run test:coverage
          elif npm run | grep -q "test"; then
            npm run test -- --coverage
          else
            echo "No test script defined; skipping tests"
          fi

      - name: Upload coverage
        if: hashFiles(format('{0}/coverage/lcov.info', matrix.app.path)) != ''
        uses: codecov/codecov-action@v4
        with:
          file: ${{ matrix.app.path }}/coverage/lcov.info
          flags: ${{ matrix.app.name }}

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: npm run build

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/console/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend/console
        run: npm ci
      
      - name: Build
        working-directory: frontend/console
        run: npm run build
        env:
          VITE_API_URL: https://api.serphona.com/v1
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/console/dist
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/console/dist
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: frontend/console
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend-console:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend-console:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
