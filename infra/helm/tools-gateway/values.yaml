global:
  imageRegistry: ""
  environment: production

image:
  repository: tools-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels: {}
  annotations: {}
  relabelings: []
  metricRelabelings: []
  additionalEndpoints: []

prometheusRule:
  enabled: true
  labels:
    service: tools-gateway
  annotations: {}
  groups:
    - name: tools-gateway.http
      rules:
        - alert: ToolsGatewayHighErrorRate
          expr: |
            sum(rate(tools_gateway_requests_total{status="5xx"}[5m])) /
            clamp_min(sum(rate(tools_gateway_requests_total[5m])), 1e-6) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High HTTP 5xx ratio in tools-gateway"
            description: "HTTP 5xx ratio > 5% over 10m for tools-gateway."

        - alert: ToolsGatewayLatencyHighP95
          expr: |
            histogram_quantile(0.95, sum by(le) (rate(tools_gateway_request_duration_seconds_bucket[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "HTTP latency p95 > 1s in tools-gateway"
            description: "p95 HTTP latency above 1s over 10m for tools-gateway."

    - name: tools-gateway.usage
      rules:
        - alert: ToolsGatewayUsageRetrySpike
          expr: |
            sum(rate(tools_gateway_usage_publish_attempts_total{outcome=~"retryable|transport_error"}[5m])) by (sink) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Retry spike for usage publishing"
            description: "Retryable publish errors are above 0.1 rps for sink {{ $labels.sink }}."

        - alert: ToolsGatewayUsageBreakerOpen
          expr: |
            max_over_time(tools_gateway_usage_publish_breaker_state[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Breaker open for usage publishing"
            description: "Circuit breaker is open for sink {{ $labels.sink }} target {{ $labels.target }}."

        - alert: ToolsGatewayUsageRateLimited
          expr: |
            sum(rate(tools_gateway_usage_publish_attempts_total{outcome="rate_limited"}[5m])) by (sink) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Usage publishing being rate limited"
            description: "Rate-limited responses observed when publishing usage for sink {{ $labels.sink }}."

grafanaDashboard:
  enabled: true
  folder: tools-gateway
  labels:
    grafana_dashboard: "1"
  annotations: {}

replicaCount: 2

env:
  SERVICE_NAME: tools-gateway
  SERVICE_INSTANCE: tools-gateway-1
  SERVICE_AUDIENCE: serphona-services

  # RAG ingestion Kafka (SASL/PLAIN against in-cluster Kafka)
  RAG_INGEST_KAFKA_ENABLED: true
  RAG_INGEST_KAFKA_BROKERS: kafka:9092
  RAG_INGEST_KAFKA_SASL_MECHANISM: plain
  RAG_INGEST_KAFKA_SASL_USERNAME: user1
  RAG_INGEST_KAFKA_SASL_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: kafka-user-passwords
        key: client-passwords

  # Auth/JWKS (produção)
  JWT_VALIDATION_JWKS_URL: ""
  JWT_VALIDATION_ISSUER: ""
  JWT_VALIDATION_AUDIENCE: serphona-services
  JWT_ALLOWED_ALGS: RS256
  JWT_JWKS_CACHE_TTL: 5m

  # Fallback dev (não usar em prod) - proveniente de Secret
  JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: tools-gateway-auth
        key: jwtSecret

  # Tokens de serviço (Secret)
  TOOLS_GATEWAY_TOKEN:
    valueFrom:
      secretKeyRef:
        name: tools-gateway-auth
        key: toolsGatewayToken
  SERVICE_AUTH_TOKEN:
    valueFrom:
      secretKeyRef:
        name: tools-gateway-auth
        key: serviceAuthToken

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
extraEnvFrom: []
extraVolumeMounts: []
extraVolumes: []
