global:
  environment: staging

image:
  tag: stg

env:
  CORS_ALLOWED_ORIGINS: "https://stg.app.serphona.com,https://stg.console.serphona.com"

  DB_USER:
    valueFrom:
      secretKeyRef:
        name: auth-gateway-db-stg
        key: username
  DB_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: auth-gateway-db-stg
        key: password

  JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: auth-gateway-auth-stg
        key: jwtSecret

  OAUTH_GOOGLE_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: auth-gateway-oauth-stg
        key: googleClientSecret
  OAUTH_MICROSOFT_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: auth-gateway-oauth-stg
        key: microsoftClientSecret
  OAUTH_APPLE_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: auth-gateway-oauth-stg
        key: appleClientSecret

  REDIS_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: auth-gateway-redis-stg
        key: password

  SERVICE_AUTH_TOKEN:
    valueFrom:
      secretKeyRef:
        name: auth-gateway-auth-stg
        key: serviceAuthToken

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true
  labels:
    env: stg
  severityLabels:
    failure: warning
    latencyP95: warning
    latencyP99: critical
    tenantMissing: warning

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-stg"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: auth.stg.serphona.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: auth-gateway-stg-tls
      hosts:
        - auth.stg.serphona.com
