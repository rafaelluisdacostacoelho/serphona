# Override values for tools-gateway deployment
# Fill in real images and secrets before deploying.
image:
  repository: tools-gateway
  tag: latest
  pullPolicy: IfNotPresent

env:
  SERVICE_NAME: tools-gateway
  SERVICE_INSTANCE: tools-gateway-1
  SERVICE_AUDIENCE: serphona-services # TODO: set to actual audience
  # Auth/JWKS (produção): preferir validação com chave pública
  JWT_VALIDATION_JWKS_URL: https://auth.example.com/.well-known/jwks.json
  JWT_VALIDATION_ISSUER: https://auth.example.com/
  JWT_VALIDATION_AUDIENCE: serphona-services
  JWT_ALLOWED_ALGS: RS256
  JWT_JWKS_CACHE_TTL: 5m

  # Fallback local/dev (não usar em prod):
  JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: tools-gateway-auth
        key: jwtSecret

  # Tokens de serviço (referencie Secrets em vez de literal)
  TOOLS_GATEWAY_TOKEN:
    valueFrom:
      secretKeyRef:
        name: tools-gateway-auth
        key: toolsGatewayToken
  SERVICE_AUTH_TOKEN:
    valueFrom:
      secretKeyRef:
        name: tools-gateway-auth
        key: serviceAuthToken

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  type: ClusterIP
  port: 8080
