global:
  imageRegistry: ""
  environment: production

image:
  repository: tenant-manager
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

metrics:
  enabled: true
  port: 9091
  path: /metrics

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  portName: metrics
  path: /metrics
  labels: {}
  annotations: {}
  relabelings: []
  metricRelabelings: []
  additionalEndpoints: []

prometheusRule:
  enabled: true
  labels:
    service: tenant-manager
  annotations: {}
  groups:
    - name: tenant-manager.availability
      rules:
        - alert: TenantManagerDown
          expr: up{service="tenant-manager"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "tenant-manager scrape is down"
            description: "Prometheus target for tenant-manager is down for 2m. Check pod/service/ingress and metrics endpoint."

    - name: tenant-manager.rate-limit
      rules:
        - alert: TenantManagerTenantRateLimited
          expr: sum(rate(tenant_manager_tenant_rate_blocked[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "tenant-manager is rate limiting tenants"
            description: "At least one tenant is hitting rate limits in the last 5m. Investigate abusive clients or raise limits if expected."

replicaCount: 2

env:
  SERVICE_NAME: tenant-manager
  SERVICE_INSTANCE: tenant-manager-1
  SERVICE_AUDIENCE: serphona-services

  # Auth/JWKS (produção)
  JWT_VALIDATION_JWKS_URL: ""
  JWT_VALIDATION_ISSUER: ""
  JWT_VALIDATION_AUDIENCE: serphona-services
  JWT_ALLOWED_ALGS: RS256
  JWT_JWKS_CACHE_TTL: 5m

  # Fallback dev (não usar em prod)
  JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: tenant-manager-auth
        key: jwtSecret

  # Tokens de serviço
  SERVICE_AUTH_TOKEN:
    valueFrom:
      secretKeyRef:
        name: tenant-manager-auth
        key: serviceAuthToken

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
extraEnvFrom: []
extraVolumeMounts: []
extraVolumes: []
